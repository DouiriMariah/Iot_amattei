# Deployed into the "dev" namespace by Argo CD.
# Change the image tag between v1 <-> v2, commit and push to
# demonstrate the CD pipeline (Argo CD auto-syncs the change).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: playground
  namespace: dev
  labels:
    app: playground
spec:
  replicas: 1
  selector:
    matchLabels:
      app: playground
  template:
    metadata:
      labels:
        app: playground
    spec:
      containers:
        - name: playground
          image: wil42/playground:v2
          ports:
            - containerPort: 8888
